plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.podwifi'
version = '0.1.0'

android {
  namespace "expo.modules.podwifi"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The beacon's background check (PodBeacon.kt).
  implementation "androidx.work:work-runtime-ktx:2.10.1"
}
