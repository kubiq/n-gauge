# Checks on every push and pull request; a release for a version tag.
#
# - firmware: scripts/check.sh as before a commit - the host tests, the car
#   and bench firmware, the upload server. The Arduino core and libraries
#   (~1 GB) are cached, keyed on what installs them.
# - app: mobile/'s typecheck, lint and tests.
# - release (a tag v*, e.g. v2026.11.09): the car firmware as the phone's OTA
#   and /firmware.bin take it, and a full image for a first flash over USB,
#   with the commits since the last tag, and the APK.
# - apk: the Android app, signed with the app's own key from secrets.
#
# The firmware carries the update signing key's public half from the
# repository variable FW_SIGN_PUB (scripts/build.sh) - public, not a secret.
# Unset, the builds simply never update themselves from a server. The
# private half, the secret FW_SIGN_KEY, signs the images (release-fw.py
# --sign-into), as the home server's are signed.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No apt here: Ubuntu's mirrors hung every package for an hour (2026-11-11)
  # and held a release with them; Python's packages come from PyPI. The
  # simulator, which needs SDL2 from them, is not built in CI (dropped
  # 2026-11-12 after a day of the mirrors timing out) - check.sh builds it
  # locally before a commit.
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FW_SIGN_PUB: ${{ vars.FW_SIGN_PUB }}
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      SKIP_SIM: 1
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # cryptography for signing (release-fw.py).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet cryptography
      - name: Cache the Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('scripts/setup-libs.sh', 'firmware/car_gauge_v1/sketch.yaml') }}
      - name: Arduino core and libraries
        run: arduino-cli update && ./scripts/setup-libs.sh
      - name: Checks
        run: ./scripts/check.sh
      # The car build once more, after check.sh's bench build: build_info.h
      # is then the car's - its build time is what the signature covers.
      # Cached, so only its stamp's file recompiles.
      - name: Car build
        run: ./scripts/build.sh gauge
      # As a release takes it: the app image, and everything at its flash
      # offset in one file (as build.sh flashes).
      - name: Firmware images
        run: |
          OUT=.build/car_gauge_v1
          BOOTAPP="$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)"
          # The newest the core brought (5.x: merge-bin; 4.x spelled it merge_bin).
          ESPTOOL="$(find ~/.arduino15/packages/esp32/tools/esptool_py -name 'esptool' -type f | sort -V | tail -1)"
          mkdir -p dist
          cp "$OUT/car_gauge_v1.ino.bin" dist/car_gauge_v1.bin
          "$ESPTOOL" --chip esp32s3 merge-bin -o dist/car_gauge_v1-full.bin \
            --flash-mode qio --flash-size 16MB \
            0x0 "$OUT/car_gauge_v1.ino.bootloader.bin" \
            0x8000 "$OUT/car_gauge_v1.ino.partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$OUT/car_gauge_v1.ino.bin"
          echo "car image: $(grep -ao "[0-9-]* [0-9:]* $(git rev-parse --short HEAD)[^\"[:cntrl:]]*" dist/car_gauge_v1.bin | head -1)"
      # Signed as release-fw.py signs for the home server: the image's
      # SHA-256 and build time, by the private key in the secret FW_SIGN_KEY
      # - so the app (and a gauge) can check a release came from it. A fork
      # without the secret gets unsigned images.
      - name: Sign
        env:
          FW_SIGN_KEY: ${{ secrets.FW_SIGN_KEY }}
        run: |
          if [ -z "$FW_SIGN_KEY" ]; then echo "no FW_SIGN_KEY secret - the images go unsigned"; exit 0; fi
          python3 scripts/release-fw.py --sign-into dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  # The APK, signed with the app's own key (mobile/plugins/
  # with-release-signing.js) from the secrets APP_KEYSTORE (the keystore,
  # base64) and APP_KEYSTORE_PASSWORD - the same key as the owner's local
  # build, so it installs as an update over it. Without them (a fork): the
  # debug key. arm64-v8a only, as scripts/build-apk.sh builds it.
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # versionCode is the commit count (app.config.ts)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
      - run: npm ci
        working-directory: mobile
      - name: Signing key
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE }}
        run: |
          if [ -z "$APP_KEYSTORE_B64" ]; then echo "no APP_KEYSTORE secret - signed with the debug key"; exit 0; fi
          echo "$APP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app-signing.jks"
          echo "APP_KEYSTORE=$RUNNER_TEMP/app-signing.jks" >> "$GITHUB_ENV"
      - name: APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          APK_JAVA_HOME="$JAVA_HOME" ./scripts/build-apk.sh
          mkdir -p dist && cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/n-gauge-$(git rev-parse --short HEAD).apk"
          rm -f "$RUNNER_TEMP/app-signing.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, apk, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "The gauge's firmware and the app, built from $(git rev-parse --short "$TAG")."
            echo
            echo "- \`n-gauge-*.apk\`: the Android app (arm64), signed with the app's own key - it updates an install of the same."
            echo "- \`car_gauge_v1.bin\`: an update - the app fetches it by itself, or from the gauge's settings page, or as /firmware.bin on the card."
            echo "- \`car_gauge_v1.bin.sig\`, \`latest\`: its signature, and its app hash, size and build time - what the app checks it by."
            echo "- \`car_gauge_v1-full.bin\`: a first flash over USB: \`esptool --chip esp32s3 write-flash 0x0 car_gauge_v1-full.bin\`."
            echo
            echo "Since ${PREV:-the start}:"
            git log --no-merges --format='- %s' ${PREV:+"$PREV.."}"$TAG"
          } > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
