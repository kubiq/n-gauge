# docker compose up -d --build. Settings in .env, not here - this file is
# public:
#   UPLOAD_TOKEN=...            required, the gauge's token
#   UPLOAD_DATA=/storage/gauge  where the uploads go (default ./data) - as the
#                               gauge wrote them, encrypted to the phone's key.
#                               It must exist and be writable by uid 1000 (the
#                               container's user): a folder Docker creates for
#                               a missing path is root's, and the uploads fail.
#   FW_GITHUB_REPO=owner/name   whose latest release the gauge updates to
#                               (default: none, no firmware)
services:
  n-gauge-upload:
    build: .
    restart: unless-stopped
    ports:
      - "8650:8650"
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?set UPLOAD_TOKEN in .env}
      FW_GITHUB_REPO: ${FW_GITHUB_REPO:-}
    volumes:
      - ${UPLOAD_DATA:-./data}:/data
